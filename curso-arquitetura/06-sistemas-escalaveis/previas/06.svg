<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">Invalidar: remover, buscar, preencher</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Invalidação remove uma entrada do cache; a próxima consulta sem cópia busca</text><text x="100" y="208.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">novamente o dado na origem.</text><rect x="120.0" y="330" width="406.6666666666667" height="150" rx="14" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/><text x="145.0" y="397.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">invalidar()</text><text x="145.0" y="435.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">10000 → null</text><path d="M534.6666666666667 405 L588.6666666666667 405" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="596.6666666666667" y="330" width="406.6666666666667" height="150" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="621.6666666666667" y="397.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">MISS</text><text x="621.6666666666667" y="435.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">origem: 12000</text><path d="M1011.3333333333335 405 L1065.3333333333335 405" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="1073.3333333333335" y="330" width="406.6666666666667" height="150" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="1098.3333333333335" y="397.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">cópia: 12000</text><text x="1098.3333333333335" y="435.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">resposta: 12000</text><rect x="590" y="605" width="500" height="100" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="615" y="666.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">leituras origem: 1 → 2</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">Alteração da origem e invalidação são operações separadas nesta demo.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">06 / 13</text></svg>