<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">Sem cache: cinco pedidos, cinco leituras</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Sem uma cópia reutilizável, cada consulta repete a leitura na origem, mesmo</text><text x="100" y="208.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">quando o dado solicitado não mudou.</text><rect x="120" y="300" width="500" height="330" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="145" y="401.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">R1 → ler → 10000</text><text x="145" y="438.75" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">R2 → ler → 10000</text><text x="145" y="476.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">R3 → ler → 10000</text><text x="145" y="513.75" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">R4 → ler → 10000</text><text x="145" y="551.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">R5 → ler → 10000</text><rect x="900" y="310" width="540" height="140" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="925" y="372.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">ORIGEM</text><text x="925" y="410.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">preço = 10000</text><rect x="900" y="540" width="540" height="110" rx="14" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/><text x="925" y="606.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">contador: 0 → 5</text><path d="M640 425 L880 425" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="640" y="401.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">5 consultas</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">O contador aumenta dentro de Catalogo.consultarPreco().</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">03 / 13</text></svg>