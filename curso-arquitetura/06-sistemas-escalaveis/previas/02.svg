<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">Vertical ou horizontal: onde vai a carga?</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Escala vertical aumenta recursos de uma instância; escala horizontal distribui</text><text x="100" y="208.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">a carga entre várias instâncias.</text><text x="120" y="278.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="28">VERTICAL</text><rect x="120" y="330" width="540" height="190" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="145" y="398.75" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">uma instância</text><text x="145" y="436.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">CPU / memória ↑</text><text x="145" y="473.75" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">R1 R2 R3 R4</text><text x="850" y="278.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="28">HORIZONTAL</text><rect x="850" y="325" width="620" height="100" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="875" y="386.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">A · R1 R3</text><rect x="850" y="465" width="620" height="100" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="875" y="526.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">B · R2 R4</text><rect x="850" y="635" width="620" height="95" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="875" y="693.75" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">mesma origem · 4 leituras</text><path d="M1090 575 L1090 620" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1110" y="604.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">ambas consultam</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">Mais réplicas web podem manter a mesma pressão na origem compartilhada.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">02 / 13</text></svg>