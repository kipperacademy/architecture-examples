<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">Escolher técnica pelo recurso protegido</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Uma técnica de escala atua sobre um recurso específico e introduz custos; a</text><text x="100" y="208.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">escolha depende do gargalo medido.</text><rect x="120" y="280" width="570" height="160" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="145" y="352.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">leituras repetidas</text><text x="145" y="390.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">cache → 5 leituras viram 1</text><rect x="850" y="280" width="620" height="160" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="875" y="352.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">imagem pública</text><text x="875" y="390.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">CDN → hit para na borda</text><rect x="120" y="520" width="570" height="170" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="145" y="597.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">sessao-ana entre A/B</text><text x="145" y="635.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">estado compartilhado → Ana</text><rect x="850" y="520" width="620" height="170" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="875" y="597.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">rajada por cliente</text><text x="875" y="635.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">rate limit → 3 passam / 2 não</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">Medir → localizar → mudar → observar efeito/custo. Cache não corrige sessão perdida.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">13 / 13</text></svg>