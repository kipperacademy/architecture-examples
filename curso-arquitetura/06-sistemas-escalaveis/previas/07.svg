<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">CDN: hit na borda, miss até a origem</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Uma CDN distribui conteúdo por pontos de presença: hits atendem na borda e</text><text x="100" y="208.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">misses buscam o conteúdo na origem.</text><text x="120" y="276.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="26">HIT · /curso.png já está na borda</text><rect x="120.0" y="310" width="406.6666666666667" height="150" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="145.0" y="377.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">cliente</text><text x="145.0" y="415.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">GET /curso.png</text><path d="M534.6666666666667 385 L588.6666666666667 385" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="596.6666666666667" y="310" width="406.6666666666667" height="150" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="621.6666666666667" y="377.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">BORDA</text><text x="621.6666666666667" y="415.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">cópia curso.png</text><path d="M1011.3333333333335 385 L1065.3333333333335 385" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="1073.3333333333335"