<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">Encontre onde a requisição parou</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Diagnóstico de rede identifica em qual etapa a requisição falha: endereço,</text><text x="100" y="208.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">encaminhamento de porta ou processo que atende.</text><rect x="100" y="310" width="300" height="100" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="125" y="371.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">endereço</text><rect x="650" y="310" width="300" height="100" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="675" y="371.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">porta</text><rect x="1200" y="310" width="300" height="100" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="1225" y="371.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">processo</text><path d="M425 360 L620 360" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="425" y="336.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">roteia</text><path d="M975 360 L1175 360" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="975" y="336.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">entrega</text><rect x="100" y="520" width="390" height="140" rx="14" fill="#ffe3e3" stroke="#c92a