<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">Reiniciar cria um contador novo</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Estado em memória pertence ao processo em execução; encerrá-lo perde esse</text><text x="100" y="208.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">estado se ele não for persistido fora do processo.</text><rect x="100" y="290" width="650" height="410" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="135" y="349.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="29">processo A</text><rect x="145" y="420" width="540" height="80" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="170" y="471.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">GET 1 → visitas=1</text><rect x="145" y="555" width="540" height="80" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="170" y="606.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">GET 2 → visitas=2</text><path d="M775 460 L1000 460" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="775" y="436.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">encerra → inicia</text><rect x="1040" y="290" width="460" height="410" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="1070" y="349.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="29">novo processo</text><text x="1090" y="430.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">memória começa em 0</text><rect x="1080" y="555" width="370" height="80" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="1105" y="606.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">GET 1 → visitas=1</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">Resultado esperado para o ensaio HTTP. Reempacotar em container não muda a vida útil dessa memória.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">07 / 10</text></svg>