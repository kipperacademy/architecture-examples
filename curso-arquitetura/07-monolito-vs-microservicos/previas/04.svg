<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">Uma repetição pode cobrar de novo</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Idempotência faz repetições com a mesma chave representarem uma operação lógica.</text><text x="125" y="280.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="25">SEM REGISTRO DE CHAVE</text><rect x="100" y="315" width="270" height="125" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="125" y="355.3225806451613" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="25.345622119815665">1ª chamada</text><text x="125" y="387.00460829493085" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="25.345622119815665">pedido-ana</text><text x="125" y="418.68663594470047" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="25.345622119815665">10000 centavos</text><path d="M380 377 L470 377" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="380" y="353.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">POST 1</text><rect x="480" y="315" width="255" height="125" rx="14" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/><text x="505" y="370.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Provedor</text><text x="505" y="407.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">1 cobrança</text><text x="100" y="492.0" fill="#c92a2a" font-family="Arial,sans-serif" font-size="22">POST 1 → resposta perdida</text><text x="100" y="519.5" fill="#c92a2a" font-family="Arial,sans-serif" font-size="22">POST 2 → novo efeito</text><rect x="100" y="525" width="635" height="115" rx="14" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/><text x="125" y="575.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Mesmo pedido → efeito repetido</text><text x="125" y="612.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">2 cobranças</text><text x="865" y="280.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="25">MESMA CHAVE: pedido-ana</text><rect x="850" y="315" width="270" height="125" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="875" y="353.93333333333334" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="26.93333333333333">1ª chamada</text><text x="875" y="387.6" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="26.93333333333333">pedido-ana</text><text x="875" y="421.26666666666665" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="26.93333333333333">chave + 10000</text><path d="M1130 377 L1220 377" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1130" y="353.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">POST 1</text><rect x="1230" y="315" width="280" height="125" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="1255" y="370.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Provedor</text><text x="1255" y="407.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">1 cobrança</text><text x="850" y="492.0" fill="#2b8a3e" font-family="Arial,sans-serif" font-size="22">POST 1 → resposta perdida</text><text x="850" y="519.5" fill="#2b8a3e" font-family="Arial,sans-serif" font-size="22">POST 2 → mesmo ID</text><rect x="850" y="525" width="660" height="115" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="875" y="575.8522231909328" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="26.591107236268527">Reconhece a chave → devolve resultado</text><text x="875" y="609.0911072362685" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="26.591107236268527">1 cobrança</text><text x="890" y="702.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="22">Nova chave = outra intenção; payload diferente</text><text x="890" y="729.5" fill="#9c36b5" font-family="Arial,sans-serif" font-size="22">com mesmo ID = conflito.</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">DemoRetry termina em 2; DemoIdempotencia termina em 1 cobrança.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">04 / 08</text></svg>