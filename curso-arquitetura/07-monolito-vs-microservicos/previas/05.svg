<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">Cada banco confirma sua própria escrita</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Transações locais confirmam mudanças de um banco; não desfazem commit em outro.</text><rect x="100" y="300" width="560" height="275" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="125" y="411.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">FINANCEIRO · banco A</text><text x="125" y="448.75" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">recebimento pedido-bia</text><text x="125" y="486.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">COMMIT confirmado</text><rect x="930" y="300" width="560" height="275" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="955" y="411.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">ACADÊMICO · banco B</text><text x="955" y="448.75" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">vaga 1 já ocupada</text><text x="955" y="486.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">pedido-bia: conflito</text><path d="M685 400 L910 400" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="685" y="376.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">pedido-bia · contrato</text><path d="M910 500 L685 500" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="685" y="476.0" fill=