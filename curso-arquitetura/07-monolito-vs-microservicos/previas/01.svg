<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">Monólito vs Microserviços</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Separar serviços troca uma fronteira interna por deploys e operações independentes.</text><rect x="100" y="350" width="370" height="175" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="125" y="411.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Compra</text><text x="125" y="448.75" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">pedido-ana</text><text x="125" y="486.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">10000 centavos</text><path d="M490 435 L720 435" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="490" y="411.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">qual fronteira?</text><rect x="745" y="350" width="650" height="175" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="770" y="430.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Decisão de arquitetura</text><text x="770" y="467.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">implantar junto ou separar?</text><text x="190" y="628.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="28">Benefício concreto precisa pagar o custo distribuído.</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">Compare autonomia, mudança e escala; não escolha pelo nome.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">01 / 08</text></svg>