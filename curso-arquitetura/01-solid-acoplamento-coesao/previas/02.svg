<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">O que é SOLID?</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Cinco princípios de design orientado a objetos para organizar responsabilidades e dependências.</text><rect x="100" y="260" width="370" height="110" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="125" y="326.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Requisito mudou</text><path d="M480 315 L570 315" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="480" y="291.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">orienta</text><rect x="585" y="245" width="520" height="140" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="610" y="307.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Responsabilidades claras</text><text x="610" y="345.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">+ contratos estáveis</text><path d="M1115 315 L1190 315" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1115" y="291.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">reduz</text><rect x="1205" y="260" width="300" height="110" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="1230" y="307.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Impacto</text><text x="1230" y="345.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">da mudança</text><text x="120" y="469.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="29">S · Responsabilidade única — separar razões de mudança.</text><text x="120" y="529.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="29">O · Aberto/fechado — estender comportamentos preservando regras.</text><text x="120" y="589.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="29">L · Substituição de Liskov — trocar implementações sem quebrar promessas.</text><text x="120" y="649.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="29">I · Segregação de interfaces — depender só das operações necessárias.</text><text x="120" y="709.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="29">D · Inversão de dependência — políticas e detalhes dependem de abstrações.</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">São critérios para decidir e revisar o design; não uma receita para criar mais classes.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">02 / 13</text></svg>