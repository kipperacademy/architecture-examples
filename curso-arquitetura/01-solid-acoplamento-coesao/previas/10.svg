<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">I · Segregação de interfaces (ISP)</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Interface Segregation Principle</text><text x="100" y="208.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Nenhum cliente deve depender de operações que não utiliza.</text><rect x="100" y="280" width="360" height="135" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="125" y="340.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Matriculas</text><text x="125" y="377.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">consulta status</text><rect x="610" y="230" width="850" height="230" rx="14" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/><text x="635" y="337.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Financeiro (hipotético)</text><text x="635" y="375.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">consultar · estornar · emitirNota</text><path d="M470 345 L590 345" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="470" y="321.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">consulta</text><text x="670" y="530.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="30">recortar a necessidade ↓</text><rect x="610" y="560" width="850" height="110" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="635" y="626.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">ConsultaPagamento.consultar(Pedido)</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">Um contrato pequeno corresponde ao consumidor; não exige uma operação por interface.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">10 / 13</text></svg>