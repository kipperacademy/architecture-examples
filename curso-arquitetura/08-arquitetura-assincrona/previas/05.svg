<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" rx="10" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="100" y="114.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="44">ACK e idempotência: não repetir o efeito</text><text x="100" y="173.0" fill="#343a40" font-family="Arial,sans-serif" font-size="28">ACK confirma o processamento ao broker; sem confirmação, pode haver reentrega.</text><text x="100" y="208.0" fill="#343a40" font-family="Arial,sans-serif" font-size="28">Idempotência faz a repetição da mesma mensagem preservar o resultado já obtido.</text><rect x="80" y="270" width="310" height="120" rx="10" fill="#f8f9fa" stroke="#9c36b5" stroke-width="1.4"/><text x="105" y="320.1152073732719" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.557603686635947">Broker entrega</text><text x="105" y="354.56221198156686" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.557603686635947">evento e42</text><path d="M405 330 L515 330" stroke="#e67700" stroke-width="1.5" fill="none" stroke-dasharray="8 6"/><path d="M502.1051460839596 335.4518567923211 L515 330 L502.1051460839596 324.5481432076789" stroke="#e67700" fill="none"/><text x="405" y="305.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="23">processa</text><rect x="530" y="240" width="610" height="210" rx="10" fill="#f8f9fa" stroke="#2b8a3e" stroke-width="1.4"/><text x="555" y="316.35" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">CONSUMIDOR · BANCO LOCAL</text><text x="555" y="350.85" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">registra aviso + ID e42</text><text x="555" y="385.35" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">na mesma transação</text><path d="M1155 330 L1245 330" stroke="#e67700" stroke-width="1.5" fill="none" stroke-dasharray="8 6"/><path d="M1232.1051460839597 335.4518567923211 L1245 330 L1232.1051460839597 324.5481432076789" stroke="#e67700" fill="none"/><text x="1155" y="305.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="23">cai</text><rect x="1260" y="270" width="260" height="120" rx="10" fill="#f8f9fa" stroke="#c92a2a" stroke-width="1.4"/><text x="1285" y="338.85" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">SEM ACK</text><rect x="80" y="565" width="310" height="120" rx="10" fill="#f8f9fa" stroke="#9c36b5" stroke-width="1.4"/><text x="105" y="616.3508064516128" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="24.112903225806452">Broker reentrega</text><text x="105" y="646.4919354838709" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="24.112903225806452">o mesmo e42</text><path d="M405 625 L515 625" stroke="#e67700" stroke-width="1.5" fill="none" stroke-dasharray="8 6"/><path d="M502.1051460839596 630.4518567923211 L515 625 L502.1051460839596 619.5481432076789" stroke="#e67700" fill="none"/><text x="405" y="600.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="23">consulta ID</text><rect x="530" y="535" width="610" height="180" rx="10" fill="#f8f9fa" stroke="#2b8a3e" stroke-width="1.4"/><text x="555" y="596.35" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">e42 já foi concluído</text><text x="555" y="630.85" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">não registra outro aviso</text><text x="555" y="665.35" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">1 efeito continua sendo 1</text><path d="M1155 625 L1245 625" stroke="#e67700" stroke-width="1.5" fill="none" stroke-dasharray="8 6"/><path d="M1232.1051460839597 630.4518567923211 L1245 625 L1232.1051460839597 619.5481432076789" stroke="#e67700" fill="none"/><text x="1155" y="600.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="23">confirma</text><rect x="1260" y="570" width="260" height="115" rx="10" fill="#f8f9fa" stroke="#9c36b5" stroke-width="1.4"/><text x="1285" y="617.6" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">ACK</text><text x="1285" y="652.1" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">ao broker</text><path d="M235 405 L235 540" stroke="#e67700" stroke-width="1.5" fill="none" stroke-dasharray="8 6"/><path d="M229.5481432076789 527.1051460839597 L235 540 L240.4518567923211 527.1051460839597" stroke="#e67700" fill="none"/><text x="270" y="478.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="23">sem ACK:</text><text x="270" y="506.75" fill="#9c36b5" font-family="Arial,sans-serif" font-size="23">reentrega</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">ACK vem após o efeito. A proteção contra duplicação precisa ser consistente com a gravação desse</text><text x="100" y="841.25" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">efeito.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">05 / 06</text></svg>