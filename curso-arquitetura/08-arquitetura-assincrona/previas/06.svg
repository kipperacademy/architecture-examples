<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" rx="10" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="100" y="114.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="44">Falhas: recuperar e acompanhar o trabalho</text><text x="100" y="173.0" fill="#343a40" font-family="Arial,sans-serif" font-size="28">Retry tenta novamente; backoff aumenta a espera; DLQ separa mensagens com falha.</text><text x="100" y="208.0" fill="#343a40" font-family="Arial,sans-serif" font-size="28">Essas políticas precisam de limites, rastreamento e um caminho de recuperação.</text><rect x="80" y="270" width="280" height="125" rx="10" fill="#f8f9fa" stroke="#c92a2a" stroke-width="1.4"/><text x="105" y="324.58602150537627" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="23">tentativa 1</text><text x="105" y="353.33602150537627" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="23">serviço offline</text><path d="M375 332 L460 332" stroke="#e67700" stroke-width="1.5" fill="none" /><path d="M447.1051460839596 337.4518567923211 L460 332 L447.1051460839596 326.5481432076789" stroke="#e67700" fill="none"/><text x="375" y="307.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="23">+1 s</text><rect x="475" y="270" width="280" height="125" rx="10" fill="#f8f9fa" stroke="#e67700" stroke-width="1.4"/><text x="500" y="323.75576036866363" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="24.377880184331794">tentativa 2</text><text x="500" y="354.2281105990784" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="24.377880184331794">falhou de novo</text><path d="M770 332 L855 332" stroke="#e67700" stroke-width="1.5" fill="none" /><path d="M842.1051460839597 337.4518567923211 L855 332 L842.1051460839597 326.5481432076789" stroke="#e67700" fill="none"/><text x="770" y="307.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="23">+5 s</text><rect x="870" y="270" width="280" height="125" rx="10" fill="#f8f9fa" stroke="#e67700" stroke-width="1.4"/><text x="895" y="324.58602150537627" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="23">tentativa 3</text><text x="895" y="353.33602150537627" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="23">limite atingido</text><path d="M1165 332 L1250 332" stroke="#e67700" stroke-width="1.5" fill="none" /><path d="M1237.1051460839597 337.4518567923211 L1250 332 L1237.1051460839597 326.5481432076789" stroke="#e67700" fill="none"/><text x="1165" y="307.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="23">isola</text><rect x="1265" y="270" width="260" height="125" rx="10" fill="#f8f9fa" stroke="#c92a2a" stroke-width="1.4"/><text x="1290" y="322.6" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">DLQ</text><text x="1290" y="357.1" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">inspecionar</text><text x="95" y="453.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="23">Exemplo de política: corrigir a causa antes de reprocessar; não repetir sem limite.</text><rect x="80" y="535" width="450" height="190" rx="10" fill="#f8f9fa" stroke="#1971c2" stroke-width="1.4"/><text x="105" y="585.680224403927" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="25.806451612903228">CONSISTÊNCIA EVENTUAL</text><text x="105" y="617.938288920056" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="25.806451612903228">pedido confirmado agora</text><text x="105" y="650.1963534361851" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="25.806451612903228">nota emitida depois</text><text x="105" y="682.4544179523141" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="25.806451612903228">acompanhar a pendência</text><rect x="575" y="535" width="450" height="190" rx="10" fill="#f8f9fa" stroke="#e67700" stroke-width="1.4"/><text x="600" y="583.6656891495602" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="26.979472140762468">ORDEM</text><text x="600" y="617.3900293255133" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="26.979472140762468">e2 termina antes de e1</text><text x="600" y="651.1143695014664" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="26.979472140762468">use chave e versão</text><text x="600" y="684.8387096774195" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="26.979472140762468">se a ordem importar</text><rect x="1070" y="535" width="450" height="190" rx="10" fill="#f8f9fa" stroke="#2b8a3e" stroke-width="1.4"/><text x="1095" y="590.9652605459057" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="23">OBSERVABILIDADE</text><text x="1095" y="619.7152605459057" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="23">eventId + pedidoId</text><text x="1095" y="648.4652605459057" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="23">tentativas + idade na fila</text><text x="1095" y="677.2152605459057" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="23">erro e estado final</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">Fila não cria capacidade infinita: backlog crescente pede limitar entrada, ajustar consumidores e</text><text x="100" y="841.25" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">investigar o gargalo.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">06 / 06</text></svg>