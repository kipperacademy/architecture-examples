<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">Saga libera a reserva após a recusa</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Saga coordena transações locais e usa compensações para falhas em etapas posteriores.</text><rect x="80" y="345" width="310" height="190" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="105" y="434.1756272401434" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="23.297491039426525">Vaga 1</text><text x="105" y="463.2974910394266" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="23.297491039426525">reservada para Bia</text><path d="M405 440 L560 440" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="405" y="416.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">cobrar</text><rect x="580" y="345" width="310" height="190" rx="14" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/><text x="605" y="432.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Cobrança</text><text x="605" y="470.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">recusada</text><path d="M905 440 L1060 440" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="905" y="416.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">compensa</text><rect x="1080" y="345" width="400" height="190" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="1105" y="432.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Vaga 1</text><text x="1105" y="470.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">liberada</text><text x="155" y="635.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">A reserva confirmada continua no histórico; a compensação também pode falhar.</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">Compensar não volta o tempo: registre a nova ação e preveja sua recuperação.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">10 / 10</text></svg>