<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">Efeito e ID processado confirmam juntos</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Consumidor idempotente grava ID único e efeito na mesma transação local.</text><rect x="65" y="340" width="280" height="190" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="90" y="427.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Broker</text><text x="90" y="465.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">evento-1</text><path d="M355 425 L405 425" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="355" y="401.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">entrega</text><rect x="420" y="300" width="360" height="270" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="445" y="400.90909090909093" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="22.72727272727273">DB CONSUMIDOR · COMMIT</text><text x="445" y="429.31818181818187" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="22.72727272727273">processados: evento-1</text><text x="445" y="457.72727272727275" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="22.72727272727273">avisos: [Ana]</text><text x="445" y="486.1363636363637" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="22.72727272727273">1 efeito aplicado</text><path d="M790 425 L850 425" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="790" y="401.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">cai</text><rect x="865" y="340" width="270" height="190" rx="14" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/><text x="890" y="411.1166253101737" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.29528535980149">Worker cai</text><text x="890" y="445.2357320099255" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.29528535980149">sem ACK</text><text x="890" y="479.3548387096774" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.29528535980149">conexão fecha</text><path d="M1145 425 L1200 425" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1145" y="401.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">volta</text><rect x="1215" y="300" width="330" height="270" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="1240" y="414.2020373514431" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="23.769100169779286">ID já existe</text><text x="1240" y="443.9134125636672" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="23.769100169779286">não reaplica efeito</text><text x="1240" y="473.6247877758913" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="23.769100169779286">ACK enviado</text><text x="160" y="669.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">O ID processado e o efeito precisam compartilhar o commit local.</text><text x="160" y="722.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="22">Demo Java em memória ilustra a regra; não prova atomicidade concorrente.</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">Na reentrega, dedupe reconhece evento-1, preserva [Ana] e confirma a mensagem.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">07 / 10</text></svg>