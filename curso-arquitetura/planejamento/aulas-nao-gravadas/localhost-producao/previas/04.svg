<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">A imagem inicia processos; não guarda a execução</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Uma imagem é um pacote para iniciar containers; um container executa processos</text><text x="100" y="208.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">isolados, compartilhando o kernel do host.</text><rect x="100" y="345" width="335" height="160" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="125" y="417.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">imagem</text><text x="125" y="455.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">classes + JRE</text><rect x="650" y="270" width="850" height="440" rx="14" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><rect x="700" y="310" width="325" height="250" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="730" y="363.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="28">container A</text><text x="730" y="449.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="29">JVM</text><text x="730" y="485.25" fill="#9c36b5" font-family="Arial,sans-serif" font-size="29">visitas = 2</text><rect x="1125" y="310" width="325" height="250" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="1155" y="363.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="28">container B</text><text x="1155" y="449.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="29">JVM</text><text x="1155" y="485.25" fill="#9c36b5" font-family="Arial,sans-serif" font-size="29">visitas = 0</text><path d="M455 365 L680 365" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="455" y="341.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">run A</text><path d="M350 515 L350 590" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M350 590 L1280 590" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="410" y="564.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">run B</text><path d="M1280 590 L1280 570" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="700" y="625" width="750" height="60" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="725" y="665.8" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="28.8">kernel Linux compartilhado</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">No Mac, Docker Desktop fornece o host Linux em uma VM. Imagem não é um contador persistido.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">04 / 10</text></svg>