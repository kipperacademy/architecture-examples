<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">Do nome público até a aplicação</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">DNS resolve um nome para um endereço; HTTPS protege a conexão e o roteamento</text><text x="100" y="208.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">encaminha a requisição até a aplicação.</text><rect x="100" y="310" width="200" height="90" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="125" y="348.4" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="26.4">nome do</text><text x="125" y="381.4" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="26.4">site</text><path d="M305 345 L450 345" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="305" y="321.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">consulta</text><rect x="475" y="290" width="500" height="110" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="500" y="337.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">DNS</text><text x="500" y="375.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">endereço do serviço</text><path d="M660 415 L250 470" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="355" y="419.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">IP resolvido</text><path d="M250 480 L250 520" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="u