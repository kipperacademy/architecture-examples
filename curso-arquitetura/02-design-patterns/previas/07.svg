<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">O mecanismo de criação é visível</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Um construtor privado limita a criação; um campo estático guarda a instância</text><text x="100" y="208.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">compartilhada.</text><rect x="100" y="245" width="1010" height="400" rx="14" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><text x="130" y="313.0" fill="#1e1e1e" font-family="Courier New,monospace" font-size="28">private static final RegistroCompras</text><text x="130" y="348.0" fill="#1e1e1e" font-family="Courier New,monospace" font-size="28">    INSTANCIA = new RegistroCompras();</text><text x="130" y="434.0" fill="#1e1e1e" font-family="Courier New,monospace" font-size="29">private RegistroCompras() {}</text><text x="130" y="527.0" fill="#1e1e1e" font-family="Courier New,monospace" font-size="27">public static RegistroCompras getInstance() {</text><text x="130" y="560.75" fill="#1e1e1e" font-family="Courier New,monospace" font-size="27">    return INSTANCIA;</text><text x="130" y="594.5" fill="#1e1e1e" font-family="Courier New,monospace" font-size="27">}</text><path d="M1120 355 L1190 355" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1120" y="249.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">new uma vez</text><rect x="1205" y="285" width="300" height="170" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="1230" y="362.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">objeto</text><text x="1230" y="400.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">único</text><text x="1150" y="596.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="26">final fixa</text><text x="1150" y="628.5" fill="#9c36b5" font-family="Arial,sans-serif" font-size="26">a referência</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">O contador ainda é mutável; final não transforma o objeto em imutável.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">07 / 18</text></svg>