<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">O escopo termina nesta execução</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">O estado em memória pertence à execução: não persiste nem é compartilhado entre processos.</text><rect x="100" y="275" width="600" height="360" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="130" y="330.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">JVM atual</text><rect x="150" y="390" width="490" height="135" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="175" y="450.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">RegistroCompras</text><text x="175" y="487.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">quantidade = 2</text><rect x="900" y="275" width="600" height="360" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="930" y="328.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="28">nova JVM / outro servidor</text><rect x="950" y="390" width="490" height="135" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="975" y="450.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">RegistroCompras</text><text x="975" y="487.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">quantidade = 0</text><path d="M720 455 L880 455" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="720" y="431.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">reiniciar</text><text x="150" y="718.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="28">quantidade++ não é seguro automaticamente entre threads.</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">Compartilhar também pode ser feito por DI com uma classe comum; Singleton é uma escolha.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">09 / 18</text></svg>