<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">Duas referências, um contador</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Identidade compartilhada significa que referências distintas apontam para o mesmo objeto.</text><rect x="100" y="275" width="360" height="110" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="125" y="341.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">registroAna</text><rect x="100" y="545" width="360" height="110" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="125" y="611.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">registroBia</text><rect x="730" y="260" width="680" height="420" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="775" y="325.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="35">UM RegistroCompras</text><rect x="785" y="390" width="170" height="100" rx="14" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><text x="810" y="451.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">0</text><rect x="995" y="390" width="170" height="100" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="1020" y="451.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">1</text><rect x="1205" y="390" width="170" height="100" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="1230" y="451.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">2</text><path d="M965 440 L985 440" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1175 440 L1195 440" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="815" y="563.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="28">Ana: 0 → 1</text><text x="1115" y="563.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="28">Bia: 1 → 2</text><text x="785" y="624.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="29">quantidade: ambos leem 2</text><path d="M470 330 L715 345" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="470" y="306.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">referência</text><path d="M470 600 L715 580" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="470" y="556.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">referência</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">registroAna == registroBia → true; não existem duas cópias sincronizadas.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">08 / 18</text></svg>