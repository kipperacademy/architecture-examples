<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">Singleton: uma instância por execução</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Singleton restringe a criação a uma instância e oferece um ponto de acesso a ela.</text><rect x="100" y="300" width="420" height="120" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="125" y="352.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">chamada 1</text><text x="125" y="390.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">getInstance()</text><rect x="100" y="540" width="420" height="120" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="125" y="592.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">chamada 2</text><text x="125" y="630.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">getInstance()</text><rect x="850" y="355" width="570" height="230" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="875" y="462.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">um RegistroCompras</text><text x="875" y="500.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">quantidade = 0</text><path d="M530 360 L835 430" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="530" y="336.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">referência</text><path d="M530 600 L835 515" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="530" y="491.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">referência</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">Um campo estático sozinho não basta: observe também quem pode construir o objeto.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">06 / 18</text></svg>