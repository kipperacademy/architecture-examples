<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">Localize a mudança antes de escolher o padrão</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">A escolha do padrão depende da responsabilidade que varia e dos limites de seu escopo.</text><rect x="100" y="250" width="600" height="115" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="125" y="318.75" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Nova promoção</text><path d="M710 305 L865 305" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="710" y="281.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">onde?</text><rect x="880" y="250" width="620" height="115" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="905" y="318.75" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Strategy + montagem</text><rect x="100" y="425" width="600" height="115" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="125" y="493.75" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Novo SDK / nova unidade</text><path d="M710 480 L865 480" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="710" y="456.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">onde?</text><rect x="880" y="425" width="620" height="115" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="905" y="493.75" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Adapter + criação/montagem</text><rect x="100" y="600" width="600" height="115" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="125" y="667.284155597723" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="26.091081593927893">Outro processo precisa do contador</text><path d="M710 655 L865 655" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="710" y="631.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">limite</text><rect x="880" y="600" width="620" height="115" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="905" y="668.6212278876171" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="29.656607700312176">Singleton local não compartilha</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">Nenhum padrão é obrigatório: justifique criação, cálculo, tradução e escopo.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">18 / 18</text></svg>