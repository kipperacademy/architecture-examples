<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">Design Patterns na prática</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Padrões de projeto são soluções recorrentes para organizar responsabilidades e</text><text x="100" y="208.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">colaboração.</text><rect x="100" y="300" width="310" height="150" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="125" y="367.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Factory</text><text x="125" y="405.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">criar</text><rect x="470" y="300" width="310" height="150" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="495" y="367.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Singleton</text><text x="495" y="405.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">instância</text><rect x="840" y="300" width="310" height="150" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="865" y="367.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Strategy</text><text x="865" y="405.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">calcular</text><rect x="1210" y="300" width="290" height="150" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="1235" y="367.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Adapter</text><text x="1235" y