<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">Dependência de código ≠ fluxo de execução</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">A regra de dependência orienta quem conhece quais tipos; o fluxo de execução</text><text x="100" y="208.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">descreve quem chama quem em tempo de execução.</text><text x="120" y="276.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="26">NO CÓDIGO: quem conhece qual tipo?</text><rect x="120" y="320" width="550" height="160" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="145" y="392.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">RepositorioEmArquivo</text><text x="145" y="430.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">implements ...</text><rect x="940" y="320" width="530" height="160" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="965" y="392.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">RepositorioMatriculas</text><text x="965" y="430.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">contrato interno</text><path d="M690 390 L920 390" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="120" y="551.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="26">NA EXECUÇÃO: quem solicita trabalho?</text><rect x="120" y="600" width="550" height="100" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="145" y="661.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">caso de uso: salvar(&quot;Ana&quot;)</text><rect x="940" y="600" width="530" height="100" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="965" y="661.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">arquivo: escreve Ana</text><path d="M690 650 L920 650" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="690" y="366.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">depende do tipo</text><text x="710" y="584.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">chamada em execução</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">MatricularAluno conhece o contrato; não importa Files nem o adaptador concreto.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">07 / 16</text></svg>