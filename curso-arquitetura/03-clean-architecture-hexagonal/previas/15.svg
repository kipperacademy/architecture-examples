<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">Lote versus processos independentes</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Processos independentes possuem memórias separadas; um lote sequencial</text><text x="100" y="208.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">compartilha a instância durante sua execução.</text><text x="120" y="276.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="26">TERMINAL · um processo por comando</text><rect x="120" y="320" width="420" height="120" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="145" y="391.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Ana → true → [Ana]</text><rect x="590" y="320" width="420" height="120" rx="14" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/><text x="615" y="391.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Bia → false → []</text><rect x="1060" y="320" width="430" height="120" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="1085" y="390.4472140762463" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.85923753665689">Clara → true → [Clara]</text><text x="120" y="531.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="26">CSV · três linhas no mesmo processo</text><rect x="120.0" y="570" width="406.6666666666667" height="150" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="145.0" y="656.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Ana → salvar</text><path d="M534.6666666666667 645 L588.6666666666667 645" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="596.6666666666667" y="570" width="406.6666666666667" height="150" rx="14" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/><text x="621.6666666666667" y="656.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Bia → recusar</text><path d="M1011.3333333333335 645 L1065.3333333333335 645" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="1073.3333333333335" y="570" width="406.6666666666667" height="150" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="1098.3333333333335" y="656.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Clara → salvar</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">CSV termina em [Ana, Clara]; os três comandos de terminal não acumulam a memória.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">15 / 16</text></svg>