<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">Terminal ou CSV: a mesma operação interna</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Uma porta de entrada expõe uma operação da aplicação; adaptadores distintos</text><text x="100" y="208.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">podem acioná-la com a mesma regra.</text><rect x="120" y="290" width="430" height="140" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="145" y="352.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">TERMINAL</text><text x="145" y="390.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Bia PENDENTE</text><rect x="120" y="555" width="430" height="140" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="145" y="617.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">CSV</text><text x="145" y="655.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Bia;PENDENTE</text><rect x="750" y="350" width="420" height="200" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="775" y="423.75" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">mesmo caso de uso</text><text x="775" y="461.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">executar(&quot;Bia&quot;,</text><text x="775" y="498.75" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">PENDENTE)</text><rect x="1270" y="390" width="260" height="120" rx="1