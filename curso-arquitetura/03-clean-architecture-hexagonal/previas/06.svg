<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">Frameworks e drivers: o mecanismo na borda</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Frameworks e drivers são mecanismos externos de execução, comunicação e</text><text x="100" y="208.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">persistência, conectados ao núcleo por adaptadores.</text><rect x="120" y="330" width="420" height="180" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="145" y="412.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">salvar(&quot;Ana&quot;)</text><text x="145" y="450.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">necessidade interna</text><rect x="800" y="250" width="610" height="150" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="825" y="317.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">MEMÓRIA</text><text x="825" y="355.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">coleção recebe Ana</text><rect x="800" y="530" width="610" height="150" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="825" y="597.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">ARQUIVO</text><text x="825" y="635.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Files escreve &quot;Ana&quot;</text><path d="M555 385 L780 325" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M555 440 L780 605" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="530" y="304.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">uma implementação</text><text x="550" y="434.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">outra implementação</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">Trocar a tecnologia exige integração; não exige reescrever o critério do pagamento.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">06 / 16</text></svg>