<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" rx="10" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="100" y="114.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="44">Fila: um trabalho para um consumidor</text><text x="100" y="173.0" fill="#343a40" font-family="Arial,sans-serif" font-size="28">O produtor publica; o message broker recebe e encaminha; o consumidor processa.</text><text x="100" y="208.0" fill="#343a40" font-family="Arial,sans-serif" font-size="28">Uma fila guarda trabalho pendente e distribui entregas entre consumidores competidores.</text><rect x="70" y="330" width="350" height="180" rx="10" fill="#f8f9fa" stroke="#1971c2" stroke-width="1.4"/><text x="95" y="391.35" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">APP PEDIDOS</text><text x="95" y="425.85" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">PRODUTOR</text><text x="95" y="460.35" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">publica tarefa</text><rect x="555" y="245" width="565" height="415" rx="10" fill="#f8f9fa" stroke="#9c36b5" stroke-width="1.4"/><text x="585" y="297.6" fill="#9c36b5" font-family="Arial,sans-serif" font-size="27.6">MESSAGE BROKER</text><text x="585" y="349.84" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24.84">FILA · enviar avisos</text><rect x="590" y="390" width="140" height="105" rx="10" fill="#f8f9fa" stroke="#e67700" stroke-width="1.4"/><text x="615" y="451.35" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">m3</text><rect x="755" y="390" width="140" height="105" rx="10" fill="#f8f9fa" stroke="#e67700" stroke-width="1.4"/><text x="780" y="451.35" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">m2</text><rect x="920" y="390" width="140" height="105" rx="10" fill="#f8f9fa" stroke="#e67700" stroke-width="1.4"/><text x="945" y="451.35" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">m1</text><text x="590" y="558.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="23">aguarda até haver</text><text x="590" y="586.75" fill="#9c36b5" font-family="Arial,sans-serif" font-size="23">consumidor disponível</text><path d="M435 425 L540 425" stroke="#e67700" stroke-width="1.5" fill="none" stroke-dasharray="8 6"/><path d="M527.1051460839597 430.4518567923211 L540 425 L527.1051460839597 419.5481432076789" stroke="#e67700" fill="none"/><text x="435" y="400.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="23">publica</text><rect x="1250" y="255" width="300" height="175" rx="10" fill="#f8f9fa" stroke="#2b8a3e" stroke-width="1.4"/><text x="1275" y="313.85" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">APP AVISOS</text><text x="1275" y="348.35" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">worker A</text><text x="1275" y="382.85" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">processa m1</text><rect x="1250" y="525" width="300" height="175" rx="10" fill="#f8f9fa" stroke="#2b8a3e" stroke-width="1.4"/><text x="1275" y="583.85" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">APP AVISOS</text><text x="1275" y="618.35" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">worker B</text><text x="1275" y="652.85" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">processa m2</text><path d="M1135 345 L1235 345" stroke="#e67700" stroke-width="1.5" fill="none" stroke-dasharray="8 6"/><path d="M1222.1051460839597 350.4518567923211 L1235 345 L1222.1051460839597 339.5481432076789" stroke="#e67700" fill="none"/><text x="1135" y="320.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="23">entrega</text><path d="M1135 590 L1235 590" stroke="#e67700" stroke-width="1.5" fill="none" stroke-dasharray="8 6"/><path d="M1222.1051460839597 595.4518567923211 L1235 590 L1222.1051460839597 584.5481432076789" stroke="#e67700" fill="none"/><text x="1135" y="565.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="23">entrega</text><text x="110" y="725.76" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25.76">Duas instâncias dividem a fila; cada uma faz uma parte do trabalho.</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">Broker recebido ≠ trabalho concluído. Uma entrega vai a um worker; após falha, a mensagem pode</text><text x="100" y="841.25" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">reaparecer.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">03 / 06</text><rect x="383" y="342" width="23" height="42" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="1.4"/><path d="M387 349 L402 349" stroke="#495057" stroke-width="1.4" fill="none" /><path d="M387 355 L402 355" stroke="#495057" stroke-width="1.4" fill="none" /><path d="M387 361 L402 361" stroke="#495057" stroke-width="1.4" fill="none" /><path d="M387 367 L402 367" stroke="#495057" stroke-width="1.4" fill="none" /><rect x="1513" y="267" width="23" height="42" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="1.4"/><path d="M1517 274 L1532 274" stroke="#495057" stroke-width="1.4" fill="none" /><path d="M1517 280 L1532 280" stroke="#495057" stroke-width="1.4" fill="none" /><path d="M1517 286 L1532 286" stroke="#495057" stroke-width="1.4" fill="none" /><path d="M1517 292 L1532 292" stroke="#495057" stroke-width="1.4" fill="none" /><rect x="1513" y="537" width="23" height="42" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="1.4"/><path d="M1517 544 L1532 544" stroke="#495057" stroke-width="1.4" fill="none" /><path d="M1517 550 L1532 550" stroke="#495057" stroke-width="1.4" fill="none" /><path d="M1517 556 L1532 556" stroke="#495057" stroke-width="1.4" fill="none" /><path d="M1517 562 L1532 562" stroke="#495057" stroke-width="1.4" fill="none" /></svg>