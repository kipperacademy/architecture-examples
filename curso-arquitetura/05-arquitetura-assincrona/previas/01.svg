<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" rx="10" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="100" y="114.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="44">Duas aplicações: quem espera por quem?</text><text x="100" y="173.0" fill="#343a40" font-family="Arial,sans-serif" font-size="28">Arquitetura assíncrona permite continuar antes do resultado final de outro serviço.</text><text x="100" y="208.0" fill="#343a40" font-family="Arial,sans-serif" font-size="28">Primeiro, veja a comunicação síncrona: a resposta só vem após concluir a operação.</text><rect x="110" y="240" width="480" height="100" rx="10" fill="#f8f9fa" stroke="#1971c2" stroke-width="1.4"/><text x="135" y="298.85" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">APLICAÇÃO A · Loja</text><rect x="1000" y="240" width="480" height="100" rx="10" fill="#f8f9fa" stroke="#2b8a3e" stroke-width="1.4"/><text x="1025" y="298.85" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">APLICAÇÃO B · Estoque</text><path d="M605 385 L980 385" stroke="#1971c2" stroke-width="1.5" fill="none" /><path d="M967.1051460839597 390.4518567923211 L980 385 L967.1051460839597 379.5481432076789" stroke="#1971c2" fill="none"/><text x="605" y="360.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="23">1 · API: reservar(item=7)</text><rect x="150" y="425" width="400" height="205" rx="10" fill="#f8f9fa" stroke="#e67700" stroke-width="1.4"/><text x="175" y="498.85" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">Loja aguarda</text><text x="175" y="533.35" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">a reserva</text><text x="175" y="567.85" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">para continuar</text><rect x="1040" y="425" width="400" height="205" rx="10" fill="#f8f9fa" stroke="#2b8a3e" stroke-width="1.4"/><text x="1065" y="498.85" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">Estoque verifica</text><text x="1065" y="533.35" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">e reserva</text><text x="1065" y="567.85" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.6">o item 7</text><path d="M985 680 L600 680" stroke="#1971c2" stroke-width="1.5" fill="none" /><path d="M612.8948539160403 674.5481432076789 L600 680 L612.8948539160403 685.4518567923211" stroke="#1971c2" fill="none"/><text x="600" y="655.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="23">2 · resposta: reservado</text><text x="150" y="749.84" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24.84">API = contrato para uma aplicação solicitar operações a outra.</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">Duas aplicações separadas ainda podem depender da mesma espera. API não significa, por si só,</text><text x="100" y="841.25" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">síncrono.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">01 / 06</text><rect x="553" y="252" width="23" height="42" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="1.4"/><path d="M557 259 L572 259" stroke="#495057" stroke-width="1.4" fill="none" /><path d="M557 265 L572 265" stroke="#495057" stroke-width="1.4" fill="none" /><path d="M557 271 L572 271" stroke="#495057" stroke-width="1.4" fill="none" /><path d="M557 277 L572 277" stroke="#495057" stroke-width="1.4" fill="none" /><rect x="1443" y="252" width="23" height="42" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="1.4"/><path d="M1447 259 L1462 259" stroke="#495057" stroke-width="1.4" fill="none" /><path d="M1447 265 L1462 265" stroke="#495057" stroke-width="1.4" fill="none" /><path d="M1447 271 L1462 271" stroke="#495057" stroke-width="1.4" fill="none" /><path d="M1447 277 L1462 277" stroke="#495057" stroke-width="1.4" fill="none" /></svg>