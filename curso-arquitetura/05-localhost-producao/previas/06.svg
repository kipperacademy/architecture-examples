<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">A configuração entra antes de atender</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Configuração externa fornece valores ao programa sem alterar seu código;</text><text x="100" y="208.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">variáveis de ambiente podem definir porta e identidade.</text><rect x="130" y="280" width="430" height="130" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="155" y="337.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">PORT=8080</text><text x="155" y="375.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">INSTANCE=A</text><rect x="980" y="280" width="430" height="130" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="1005" y="337.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">PORT=8081</text><text x="1005" y="375.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">INSTANCE=B</text><rect x="650" y="315" width="270" height="150" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="675" y="383.6635944700461" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="25.345622119815665">mesmo</text><text x="675" y="415.3456221198157" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="25.345622119815665">Servidor.class</text><path d="M345 430 L345 515" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text