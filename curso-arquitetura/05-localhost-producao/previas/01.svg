<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">Código precisa virar um processo acessível</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Um processo é uma instância de um programa em execução; um servidor atende</text><text x="100" y="208.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">requisições enquanto escuta em um endereço e porta.</text><rect x="100" y="350" width="330" height="110" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="125" y="416.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Servidor.java</text><path d="M450 405 L580 405" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="450" y="381.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">javac</text><rect x="600" y="350" width="350" height="110" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="625" y="416.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Servidor.class</text><path d="M970 405 L1100 405" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="970" y="381.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">java</text><rect x="1120" y="290" width="370" height="250" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="1150" y="355.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">processo JVM</text><text x="1150" y="428.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="28">escuta :8080</text><rect x="150" y="625" width="200" height="90" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="175" y="679.0725806451613" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="24.193548387096776">GET /curso</text><path d="M360 660 L1280 660" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="360" y="636.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">requisição pela rede</text><path d="M1300 650 L1300 550" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="670" y="753.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="28">resposta: instancia=local | visitas=1</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">Código é o programa; processo é a execução que guarda estado e atende requisições.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">01 / 10</text></svg>