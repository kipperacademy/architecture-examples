<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">Uma VM recebe seu próprio sistema operacional</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Uma máquina virtual executa um sistema operacional convidado com kernel</text><text x="100" y="208.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">próprio, usando recursos geridos por um hipervisor.</text><rect x="130" y="270" width="1340" height="440" rx="14" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><rect x="180" y="310" width="550" height="285" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="215" y="345" width="475" height="75" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="240" y="393.75" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">processo Java</text><rect x="215" y="475" width="475" height="80" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="240" y="525.2822580645161" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.419354838709676">SO convidado A + kernel A</text><rect x="870" y="310" width="550" height="285" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><rect x="905" y="345" width="475" height="75" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="930" y="393.75" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">outro processo</text><rect x="905" y="475" width="475" height="80" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="930" y="525.2822580645161" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27.419354838709676">SO convidado B + kernel B</text><rect x="180" y="635" width="1240" height="60" rx="14" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><text x="205" y="675.8" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="28.8">HIPERVISOR → CPU, memória e disco físicos</text><path d="M445 575 L445 620" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1130 575 L1130 620" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="500" y="624.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="22">usa recursos</text><text x="1190" y="624.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="22">usa recursos</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">VM A e VM B têm kernels próprios. Servidor pode nomear a máquina ou o processo que atende.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">03 / 10</text></svg>