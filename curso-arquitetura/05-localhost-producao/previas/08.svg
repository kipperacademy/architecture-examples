<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">Build e execução têm papéis separados</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Build produz o artefato; runtime executa o artefato. Um build em estágios</text><text x="100" y="208.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">separa ferramentas de compilação da imagem final.</text><rect x="100" y="285" width="620" height="380" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="130" y="340.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">build · JDK 21</text><rect x="150" y="390" width="490" height="75" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="175" y="438.75" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Servidor.java</text><path d="M395 480 L395 535" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="395" y="456.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">javac</text><rect x="150" y="550" width="490" height="75" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="175" y="598.75" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">out/Servidor.class</text><rect x="940" y="285" width="560" height="380" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="970" y="340.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">imagem final · JRE 21</text><rect x="990" y="420" width="450" height="90" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="1015" y="476.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">/app/Servidor.class</text><rect x="990" y="555" width="450" height="75" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="1015" y="603.4970674486804" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="29.32551319648094">java -cp /app Servidor</text><path d="M735 470 L925 470" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="735" y="446.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">COPY --from</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">O Dockerfile usa dois estágios. A imagem final não precisa carregar o compilador nem o fonte.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">08 / 10</text></svg>