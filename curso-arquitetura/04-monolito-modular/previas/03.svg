<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">A fronteira também aparece no código</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Encapsulamento protege o estado interno: outros módulos usam operações do</text><text x="100" y="208.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">contrato em vez de alterar os dados diretamente.</text><rect x="110" y="285" width="590" height="360" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="140" y="344.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="29">Matriculas.java</text><text x="140" y="422.0" fill="#1e1e1e" font-family="Courier New,monospace" font-size="27">if (cobrancas</text><text x="140" y="455.75" fill="#1e1e1e" font-family="Courier New,monospace" font-size="27">    .estaConfirmado(pedido))</text><text x="140" y="489.5" fill="#1e1e1e" font-family="Courier New,monospace" font-size="27">    alunas.add(aluna);</text><rect x="900" y="285" width="600" height="360" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="930" y="344.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="29">Cobrancas.java</text><text x="930" y="419.0" fill="#1e1e1e" font-family="Courier New,monospace" font-size="24">private final Set&lt;String&gt;</text><text x="930" y="449.0" fill="#1e1e1e" font-family="Courier New,monospace" font-size="24">    confirmadas = new HashSet&lt;&gt;();</text><path d="M720 420 L880 420" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="720" y="396.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">chamada</text><path d="M880 595 L720 595" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="720" y="571.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">boolean</text><text x="240" y="738.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="28">Pode mudar a estrutura interna → o retorno boolean continua igual.</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">Contrato concreto desta demo: dependência de Cobrancas. Separar módulos não elimina toda</text><text x="100" y="841.25" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">dependência.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">03 / 09</text></svg>