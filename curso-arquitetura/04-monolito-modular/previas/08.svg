<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">Rollback local não alcança a cobrança externa</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Uma transação local cobre apenas seus recursos participantes; ROLLBACK não</text><text x="100" y="208.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">desfaz automaticamente um efeito remoto.</text><rect x="120" y="290" width="710" height="365" rx="14" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><text x="160" y="338.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="28">banco da escola</text><rect x="170" y="405" width="290" height="90" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="195" y="459.0725806451613" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="24.193548387096776">INSERT matrícula</text><rect x="500" y="405" width="260" height="90" rx="14" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/><text x="525" y="461.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">ROLLBACK</text><rect x="1040" y="290" width="460" height="365" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="1070" y="338.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="28">provedor remoto</text><rect x="1080" y="425" width="380" height="100" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="1105" y="485.50509337860785" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="28.01358234295416">cobrança confirmada</text><path d="M840 390 L1020 390" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="840" y="366.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">HTTP: cobrar</text><text x="885" y="585.0" fill="#c92a2a" font-family="Arial,sans-serif" font-size="45">✕</text><text x="245" y="737.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="27">A linha local desaparece.</text><text x="1000" y="737.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="27">O efeito remoto continua.</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">Cenário ilustrativo: compensação/reconciliação é outra operação. A demo SQL não cobra dinheiro.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">08 / 09</text></svg>