<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">Uma aplicação, duas capacidades</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Um monólito modular é uma aplicação implantada como uma unidade, com</text><text x="100" y="208.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">capacidades e responsabilidades separadas em módulos.</text><rect x="160" y="280" width="1240" height="330" rx="14" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><text x="200" y="327.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="27">processo da escola</text><rect x="220" y="370" width="430" height="170" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="250" y="427.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="32">Financeiro</text><text x="250" y="471.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="23">confirmadas = {pedido-ana}</text><rect x="950" y="370" width="390" height="170" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="980" y="427.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="32">Acadêmico</text><text x="980" y="474.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="26">alunas = [Ana]</text><path d="M930 430 L670 430" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="670" y="406.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">consulta local</text><rect x="250" y="665" width="390" height="70" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="275" y="708.9410939691444" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="23.842917251051894">alteração no Financeiro</text><path d="M660 700 L820 700" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="660" y="676.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">build</text><rect x="840" y="665" width="510" height="70" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="865" y="711.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">1 artefato → 1 deploy</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">Mudar um módulo recompila a aplicação; não cria uma chamada de rede.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">01 / 09</text></svg>