<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">Coesão: agrupar pelo propósito</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">As operações azuis decidem acesso; o detalhe amarelo entrega uma mensagem.</text><rect x="120" y="260" width="1360" height="160" rx="14" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><rect x="160" y="290" width="360" height="100" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="185" y="349.8684210526316" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="26.31578947368421">Consultar pagamento</text><rect x="580" y="290" width="350" height="100" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="605" y="351.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Registrar acesso</text><rect x="990" y="290" width="440" height="100" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="1015" y="351.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">SDK / texto do aviso</text><path d="M350 435 L350 515" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="350" y="411.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">agrupar</text><path d="M760 435 L450 515" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1210 435 L1210 515" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1210" y="411.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">separar</text><rect x="180" y="530" width="660" height="120" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="205" y="582.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Matrícula</text><text x="205" y="620.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">consulta + decisão + coordenação</text><rect x="960" y="530" width="480" height="120" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="985" y="582.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Comunicação</text><text x="985" y="620.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">detalhes do envio</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">Vários métodos podem ser coesos; o critério é o propósito que compartilham.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">05 / 13</text></svg>