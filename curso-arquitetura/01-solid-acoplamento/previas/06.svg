<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">S · Responsabilidade única (SRP)</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Single Responsibility Principle</text><text x="100" y="208.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Uma classe deve ter uma única razão para mudar, ligada a um ator ou grupo responsável.</text><rect x="120" y="275" width="570" height="110" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="145" y="322.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Acadêmico: aceitar bolsa</text><text x="145" y="360.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">como condição de acesso</text><rect x="900" y="275" width="570" height="110" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="925" y="322.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Comunicação: trocar</text><text x="925" y="360.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">texto / fornecedor do aviso</text><path d="M405 400 L405 505" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="445" y="454.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">muda</text><path d="M1185 400 L1185 505" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1225" y="454.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">muda</text><rect x="120" y="520" width="570" height="145" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="145" y="585.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Regra de matrícula</text><text x="145" y="622.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">consulta e decide acesso</text><rect x="900" y="520" width="570" height="145" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="925" y="585.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Implementação do aviso</text><text x="925" y="622.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">formata e envia</text><text x="730" y="484.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="44">≠</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">Coordenar o caso de uso é uma responsabilidade; implementar todo detalhe é outra.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">06 / 13</text></svg>