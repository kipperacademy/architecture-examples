<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">A falha interrompe antes do acesso</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Na versão acoplada, a exceção sai de confirmar antes de acessos.add.</text><rect x="100" y="270" width="360" height="125" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="125" y="325.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">3 pagamentos</text><text x="125" y="362.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">CONFIRMADO</text><path d="M470 332 L555 332" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="470" y="308.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">continua</text><rect x="570" y="270" width="460" height="125" rx="14" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/><text x="595" y="325.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">email.enviar(...)</text><text x="595" y="362.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">IOException</text><path d="M1040 332 L1130 332" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1040" y="308.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">para</text><rect x="1145" y="270" width="350" height="125" rx="14" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><text x="1170" y="325.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">acessos.add(...)</text><text x="1170" y="362.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">NÃO executado</text><text x="180" y="525.0" fill="#1e1e1e" font-family="Courier New,monospace" font-size="30">email.enviar(pedido.aluna());</text><text x="180" y="562.5" fill="#1e1e1e" font-family="Courier New,monospace" font-size="30">acessos.add(pedido.aluna());</text><rect x="1070" y="500" width="410" height="160" rx="14" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/><text x="1095" y="572.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">0 / 3</text><text x="1095" y="610.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">acessos</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">Repete a mesma interrupção para Ana, Bia e Clara; o total vem do Set real.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">12 / 13</text></svg>