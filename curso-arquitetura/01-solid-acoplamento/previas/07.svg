<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9c36b5" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="14" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="58" y="72" width="10" height="130" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="100" y="114.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="44">D · Inversão de dependência (DIP)</text><text x="100" y="173.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Dependency Inversion Principle</text><text x="100" y="208.0" fill="#687078" font-family="Arial,sans-serif" font-size="28">Políticas de alto nível e detalhes dependem de abstrações, não uns dos outros.</text><rect x="100" y="310" width="400" height="180" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="125" y="392.5" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Matriculas</text><text x="125" y="430.0" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Notificador canal</text><rect x="650" y="300" width="410" height="200" rx="14" fill="#e5dbff" stroke="#9c36b5" stroke-width="2"/><text x="675" y="373.75" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Notificador</text><text x="675" y="411.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">enviar(aluna)</text><text x="675" y="448.75" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">falha: IOException</text><rect x="1210" y="255" width="290" height="130" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="1235" y="331.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">Email</text><rect x="1210" y="475" width="290" height="130" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/><text x="1235" y="551.25" fill="#1e1e1e" font-family="Arial,sans-serif" font-size="30">WhatsApp</text><path d="M510 400 L635 400" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="510" y="376.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">conhece</text><path d="M1200 320 L1070 350" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1070" y="296.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">implementa</text><path d="M1200 540 L1070 455" stroke="#9c36b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1070" y="431.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="24">implementa</text><text x="140" y="681.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="26">A aplicação também conhece ConsultaPagamento: apenas consultar.</text><text x="100" y="810.0" fill="#9c36b5" font-family="Arial,sans-serif" font-size="25">Receber no construtor é injeção; depender do contrato protege a política dos detalhes.</text><text x="1430" y="873.0" fill="#687078" font-family="Arial,sans-serif" font-size="18">07 / 13</text></svg>